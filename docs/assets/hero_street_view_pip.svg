<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Street View Navigator (PiP) v1.4.2 — Pegman Drag-and-Drop and Bottom-Right Edge WebView2 PiP Architecture">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1a"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c2448"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="fovGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="goldBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="hatBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="55%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Backdrop -->
  <rect width="1200" height="360" rx="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="1196" height="356" rx="13" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Subtle Metric EPSG:5253 Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.7">
    <line x1="80" y1="0" x2="80" y2="360"/><line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/><line x1="440" y1="0" x2="440" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/><line x1="680" y1="0" x2="680" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/><line x1="920" y1="0" x2="920" y2="360"/>
    <line x1="1040" y1="0" x2="1040" y2="360"/>
    <line x1="0" y1="72" x2="1200" y2="72"/><line x1="0" y1="144" x2="1200" y2="144"/>
    <line x1="0" y1="216" x2="1200" y2="216"/><line x1="0" y1="288" x2="1200" y2="288"/>
  </g>

  <!-- Left Card: QGIS Map Canvas + Blue SVV Coverage + Cowboy Pegman -->
  <g transform="translate(36, 36)">
    <rect width="510" height="288" rx="10" fill="#0b1324" stroke="#334155" stroke-width="1.4"/>
    <!-- Simulated Urban Parcels & Road Corridors -->
    <polygon points="30,30 165,30 150,120 30,120" fill="#162136" stroke="#24344f" stroke-width="1"/>
    <polygon points="195,30 340,30 330,120 180,120" fill="#162136" stroke="#24344f" stroke-width="1"/>
    <polygon points="365,30 480,30 480,125 358,125" fill="#162136" stroke="#24344f" stroke-width="1"/>
    <polygon points="30,152 152,152 142,250 30,250" fill="#162136" stroke="#24344f" stroke-width="1"/>
    <polygon points="182,152 332,152 325,250 170,250" fill="#162136" stroke="#24344f" stroke-width="1"/>
    <polygon points="360,155 480,155 480,250 352,250" fill="#162136" stroke="#24344f" stroke-width="1"/>

    <!-- Blue Street View Coverage Lines (mts2.google.com/mapslt?lyrs=svv) -->
    <g stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" opacity="0.82" filter="url(#glow)">
      <line x1="20" y1="136" x2="490" y2="140"/>
      <line x1="178" y1="20" x2="156" y2="264"/>
      <line x1="352" y1="20" x2="340" y2="264"/>
    </g>

    <!-- Geodesic Field-of-View Cone -->
    <g transform="translate(260, 138)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-18;16;-18" dur="5.5s" repeatCount="indefinite"/>
        <path d="M 0,0 L 74,-48 A 88,88 0 0,1 74,48 Z" fill="url(#fovGrad)" stroke="#38bdf8" stroke-width="1.6"/>
      </g>
      <circle cx="0" cy="0" r="8" fill="#38bdf8" opacity="0.28">
        <animate attributeName="r" values="7;15;7" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.45;0.05;0.45" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="4.2" fill="#facc15" stroke="#0f172a" stroke-width="1.5"/>

      <!-- 3D Cowboy Pegman Marker (No face, brown cowboy hat + red bandana) -->
      <g transform="translate(0, -18)">
        <ellipse cx="3" cy="18" rx="9" ry="3.2" fill="#020617" opacity="0.55"/>
        <!-- Body -->
        <path d="M -7,-2 L 7,-2 L 5,8 L 3,8 L 3,16 L -3,16 L -3,8 L -5,8 Z" fill="url(#goldBody)" stroke="#291507" stroke-width="1.4"/>
        <!-- Red Bandana -->
        <polygon points="-5,-2 5,-2 0,3" fill="#dc2626" stroke="#7f1d1d" stroke-width="0.9"/>
        <!-- Eyeless 3D Head -->
        <circle cx="0" cy="-9" r="5.5" fill="url(#goldBody)" stroke="#291507" stroke-width="1.4"/>
        <!-- Cowboy Hat -->
        <path d="M -10,-12 Q 0,-10 10,-12 Q 7,-14 5,-14 L 3.5,-20 L 0,-18.5 L -3.5,-20 L -5,-14 Q -7,-14 -10,-12 Z" fill="url(#hatBrown)" stroke="#291507" stroke-width="1.3"/>
        <line x1="-5" y1="-13.6" x2="5" y2="-13.6" stroke="#dc2626" stroke-width="1.4"/>
      </g>
    </g>

    <!-- Bottom-Left Tag Inside Canvas -->
    <rect x="12" y="10" width="232" height="24" rx="5" fill="#0f172a" fill-opacity="0.88" stroke="#38bdf8" stroke-width="0.9"/>
    <text x="22" y="26" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">QgsMapCanvas • EPSG:5253 (TM30)</text>
    <rect x="12" y="254" width="268" height="22" rx="4" fill="#0f172a" fill-opacity="0.88" stroke="#334155" stroke-width="0.9"/>
    <text x="22" y="269" fill="#93c5fd" font-family="Consolas, monospace" font-size="10.5">18m Road Centerline Snap • 33 FPS Sync</text>
  </g>

  <!-- Center Telemetry & Bidirectional Bridge -->
  <g transform="translate(558, 128)">
    <path d="M 0,44 L 84,44" stroke="url(#accentLine)" stroke-width="2.5" stroke-dasharray="6 4"/>
    <polygon points="84,39 94,44 84,49" fill="#facc15"/>
    <path d="M 94,64 L 10,64" stroke="url(#accentLine)" stroke-width="2.5" stroke-dasharray="6 4"/>
    <polygon points="10,59 0,64 10,69" fill="#38bdf8"/>
    <circle cx="47" cy="44" r="3.5" fill="#38bdf8">
      <animate attributeName="cx" values="6;82;6" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <text x="47" y="24" text-anchor="middle" fill="#facc15" font-family="Consolas, monospace" font-size="11" font-weight="700">WGS84 ⇄ 5253</text>
    <text x="47" y="88" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="600">WebView2 COM</text>
    <text x="47" y="102" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="10">/ QtWebEngine</text>
  </g>

  <!-- Right Card: Corner-Anchored Resizable PiP Street View Window + Title -->
  <g transform="translate(664, 36)">
    <!-- Title Block Above PiP Mockup -->
    <text x="0" y="24" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="25" font-weight="800">Street View Navigator (PiP)</text>
    <text x="0" y="47" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">v1.4.2 • 3D Cowboy Pegman, Edge WebView2 &amp; QGIS 3/4 (Qt5/Qt6)</text>

    <!-- PiP Overlay Window Diagram -->
    <g transform="translate(0, 68)">
      <rect width="500" height="220" rx="9" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
      <!-- PiP Header -->
      <rect x="1" y="1" width="498" height="30" rx="8" fill="#0b1120"/>
      <text x="14" y="20" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">↖</text>
      <rect x="30" y="5" width="22" height="20" rx="4" fill="#fef08a" stroke="#eab308"/>
      <circle cx="41" cy="11" r="3" fill="#facc15" stroke="#291507" stroke-width="1"/>
      <rect x="37.5" y="14.5" width="7" height="7" rx="1.5" fill="#facc15" stroke="#291507" stroke-width="1"/>
      <text x="60" y="20" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Street View</text>

      <!-- Header Preset Pills -->
      <g transform="translate(278, 5)" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700">
        <rect x="0" y="0" width="24" height="20" rx="4" fill="#1e293b" stroke="#475569"/>
        <text x="12" y="14" text-anchor="middle" fill="#facc15">🎉</text>
        <rect x="28" y="0" width="22" height="20" rx="4" fill="#1e293b" stroke="#475569"/>
        <text x="39" y="14" text-anchor="middle" fill="#e2e8f0">S</text>
        <rect x="54" y="0" width="22" height="20" rx="4" fill="#0284c7" stroke="#38bdf8"/>
        <text x="65" y="14" text-anchor="middle" fill="#ffffff">M</text>
        <rect x="80" y="0" width="22" height="20" rx="4" fill="#1e293b" stroke="#475569"/>
        <text x="91" y="14" text-anchor="middle" fill="#e2e8f0">L</text>
        <rect x="106" y="0" width="34" height="20" rx="4" fill="#1e293b" stroke="#475569"/>
        <text x="123" y="14" text-anchor="middle" fill="#e2e8f0">Max</text>
        <rect x="144" y="0" width="22" height="20" rx="4" fill="#1e293b" stroke="#475569"/>
        <text x="155" y="13" text-anchor="middle" fill="#e2e8f0">_</text>
        <rect x="170" y="0" width="22" height="20" rx="4" fill="#7f1d1d" stroke="#ef4444"/>
        <text x="181" y="14" text-anchor="middle" fill="#fee2e2">X</text>
      </g>

      <!-- Clean Street View Viewport Content Diagram -->
      <rect x="8" y="36" width="484" height="150" rx="4" fill="#132642"/>
      <!-- Sky & Horizon Street Perspective -->
      <rect x="8" y="36" width="484" height="72" rx="4" fill="#1d4ed8" opacity="0.28"/>
      <polygon points="8,186 210,108 290,108 492,186" fill="#1e293b"/>
      <line x1="250" y1="108" x2="250" y2="186" stroke="#facc15" stroke-width="2" stroke-dasharray="10 8" opacity="0.8"/>
      <!-- Street Facade Silhouettes -->
      <polygon points="8,46 196,90 196,128 8,176" fill="#0f172a" stroke="#334155"/>
      <polygon points="492,46 304,90 304,128 492,176" fill="#0f172a" stroke="#334155"/>
      <circle cx="250" cy="146" r="14" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.75"/>
      <polygon points="244,148 250,136 256,148" fill="#38bdf8" opacity="0.9"/>

      <!-- Pure Panorama Tag -->
      <rect x="18" y="45" width="248" height="22" rx="4" fill="#0f172a" fill-opacity="0.84" stroke="#10b981"/>
      <text x="27" y="60" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700">✓ Clean Panorama Mode (No Clutter / Ads)</text>

      <!-- Footer Strip -->
      <rect x="1" y="191" width="498" height="28" rx="6" fill="#0b1120"/>
      <text x="12" y="209" fill="#94a3b8" font-family="Consolas, monospace" font-size="10">5253: 564445, 4217587 | 265°</text>
      <g transform="translate(226, 195)" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700">
        <rect x="0" y="0" width="32" height="19" rx="3" fill="#0284c7"/><text x="16" y="13" text-anchor="middle" fill="#fff">Cov</text>
        <rect x="36" y="0" width="32" height="19" rx="3" fill="#0284c7"/><text x="52" y="13" text-anchor="middle" fill="#fff">Cln</text>
        <rect x="72" y="0" width="32" height="19" rx="3" fill="#0284c7"/><text x="88" y="13" text-anchor="middle" fill="#fff">Syn</text>
        <rect x="108" y="0" width="32" height="19" rx="3" fill="#1e293b" stroke="#475569"/><text x="124" y="13" text-anchor="middle" fill="#e2e8f0">+Pt</text>
        <rect x="144" y="0" width="32" height="19" rx="3" fill="#1e293b" stroke="#475569"/><text x="160" y="13" text-anchor="middle" fill="#e2e8f0">Cfg</text>
        <rect x="180" y="0" width="32" height="19" rx="3" fill="#1e293b" stroke="#475569"/><text x="196" y="13" text-anchor="middle" fill="#e2e8f0">Cpy</text>
        <rect x="216" y="0" width="34" height="19" rx="3" fill="#1e293b" stroke="#475569"/><text x="233" y="13" text-anchor="middle" fill="#e2e8f0">Web</text>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="head3d" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    <linearGradient id="body3d" x1="15%" y1="0%" x2="88%" y2="85%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="55%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="hat3d" x1="15%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="55%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="bandana3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>
  <!-- 3D Ground shadow -->
  <ellipse cx="34" cy="58" rx="14" ry="4" fill="rgba(15,23,42,0.32)"/>
  <!-- Legs with 3D shading -->
  <rect x="24" y="40" width="7" height="16" rx="3" fill="url(#body3d)" stroke="#1e1b18" stroke-width="2.1"/>
  <rect x="33" y="40" width="7" height="16" rx="3" fill="url(#body3d)" stroke="#1e1b18" stroke-width="2.1"/>
  <!-- Arms -->
  <rect x="13" y="29" width="6" height="14" rx="3" fill="url(#body3d)" stroke="#1e1b18" stroke-width="2"/>
  <rect x="45" y="29" width="6" height="14" rx="3" fill="url(#body3d)" stroke="#1e1b18" stroke-width="2"/>
  <!-- Torso -->
  <path d="M18 30 C18 25.5 46 25.5 46 30 L44 43 L20 43 Z" fill="url(#body3d)" stroke="#1e1b18" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Red Bandana -->
  <path d="M23 28 L41 28 L32 37.5 Z" fill="url(#bandana3d)" stroke="#450a0a" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Smooth eyeless 3D Head -->
  <circle cx="32" cy="19" r="8.4" fill="url(#head3d)" stroke="#1e1b18" stroke-width="2.2"/>
  <!-- 3D Cowboy Hat -->
  <path d="M15 15.5 Q32 19.5 49 15.5 Q44 12.2 39 12.6 L37 5.2 Q32 7.2 27 5.2 L25 12.6 Q20 12.2 15 15.5 Z" fill="url(#hat3d)" stroke="#1e1b18" stroke-width="2" stroke-linejoin="round"/>
  <!-- Red hatband -->
  <path d="M24.8 12.7 Q32 14.4 39.2 12.7" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round"/>
</svg>
